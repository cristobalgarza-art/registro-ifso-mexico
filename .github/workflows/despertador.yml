name: Despertador de la base de datos
# Supabase Free pausa el proyecto tras 7 días sin actividad. Esta tarea hace una consulta
# ligera cada 3 días para que nunca se pause. Deja de ser necesaria en el plan Pro.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        run: |
          KEY="sb_publishable_DyNe5-5Yq3IcoPQIRrfcDQ_WZo3hm_D"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://yqzwvnfzryyvuqfgqwys.supabase.co/rest/v1/centros?select=id&limit=1")
          echo "Respuesta: $code"
          test "$code" = "200"
